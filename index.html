<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Tag Master</title>
    <meta name="description" content="Tool to manual print QR coded thermal labels.">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tag Master">
    <meta property="og:description" content="Tool to manual print QR coded thermal labels.">
  </head>

  <body>
    <script>
      // Default light; restore saved theme before paint to avoid flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
